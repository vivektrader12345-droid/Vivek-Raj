services:
  - type: web
    name: vivek-raj
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FIREBASE_PROJECT_ID
        value: vivek-crypto-trader-b8d19
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/serviceAccountKey.json
      - key: WEBHOOK_BASE_URL
        value: https://vivek-raj.onrender.com
      - key: WEBHOOK_LIVE_EXECUTION_ENABLED
        value: "false"
      - key: LEGACY_WEBHOOK_LIVE_ENABLED
        value: "false"
      - key: WEBHOOK_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: AUTO_TRADE_ENABLED
        value: "false"
      - key: CONNECT_EXCHANGE_ON_STARTUP
        value: "false"
      - key: USE_TESTNET
        value: "true"
