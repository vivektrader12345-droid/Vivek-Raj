# Render.com deployment config (FREE tier)
# Push this backend folder to a GitHub repo, then connect to Render

services:
  - type: web
    name: vivek-raj
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: vivek-crypto-trader-b8d19
      # Provision this file through Render Secret Files; never commit its contents.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/serviceAccountKey.json
      - key: WEBHOOK_BASE_URL
        value: https://vivek-raj.onrender.com
      - key: WEBHOOK_LIVE_EXECUTION_ENABLED
        value: "false"
      - key: LEGACY_WEBHOOK_LIVE_ENABLED
        value: "false"
      - key: WEBHOOK_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: AUTO_TRADE_ENABLED
        value: "false"
      - key: CONNECT_EXCHANGE_ON_STARTUP
        value: "false"
      - key: USE_TESTNET
        value: "true"
      - key: DEFAULT_TRADE_AMOUNT_USDT
        value: "10"
      - key: DEFAULT_LEVERAGE
        value: "1"
