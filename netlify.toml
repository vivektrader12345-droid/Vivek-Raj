[build]
  publish = "dist"
  command = "npm run build && npm run test:pwa:static"

[build.environment]
  VITE_WEBHOOK_API_URL = "https://vivek-raj.onrender.com"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/downloads/vivek-marco-trader.apk"
  [headers.values]
    Cache-Control = "no-store"
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"vivek-marco-trader.apk\""

[[redirects]]
  from = "/downloads/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
